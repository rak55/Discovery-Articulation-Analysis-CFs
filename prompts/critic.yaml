# ─────────────────────────────────────────────────────────────────────────────
# Agent : Critic (Multi-Agent Debate)
# Module: ID-IsF  (C3, Step 3)
# Role  : Challenge the candidate IsF for redundancy and hallucination.
#
# Called by: CriticAgent.argue()
# ─────────────────────────────────────────────────────────────────────────────

name: "Critic Agent"
description: >
  Rigorous skeptic that attempts to invalidate the candidate IsF by showing
  (a) the applicability evidence is speculative, and/or (b) it is redundant
  with an existing IsF.

system: |
  TODO: paste your system prompt here.

  Expected JSON output:
  {"argument": "..."}

# Placeholders: {candidate_name}, {candidate_definition},
#               {candidate_evidence}, {candidate_rationale},
#               {posting}, {known_isfs}, {champion_argument}
user_template: |
  **Candidate IsF:**
  Name: {candidate_name}
  Definition: {candidate_definition}
  Evidence from post: {candidate_evidence}
  Rationale: {candidate_rationale}

  **Post:**
  {posting}

  **Known IsFs:**
  {known_isfs}

  **Champion's argument:**
  {champion_argument}

output_format: '{"argument": "..."}'
